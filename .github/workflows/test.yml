name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_VERSION: v1.9.0
  SLITHER_VERSION: 0.11.6
  ADERYN_VERSION: 0.6.8
  ADERYN_REV: a288420403cb1ae5f38ce606c3a6d4e605b9c81d # tag aderyn-v0.6.8

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  slither:
    name: slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "slither-analyzer==${SLITHER_VERSION}"
      # Fails the job on any finding outside lib/ (see slither.config.json).
      - run: slither . --fail-low

  aderyn:
    name: aderyn
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Aderyn is not on npm or crates.io, and the v0.6.8 release binaries were
      # removed from GitHub, so build it from source at the tag's commit.
      - name: Build aderyn ${{ env.ADERYN_VERSION }} from source
        run: cargo install --locked --git https://github.com/Cyfrin/aderyn --rev "${ADERYN_REV}" aderyn
      - run: aderyn --version
      - run: aderyn . --output aderyn-report.md
      - name: Fail on any High finding
        run: |
          cat aderyn-report.md
          if grep -q "^# High Issues" aderyn-report.md; then echo "Aderyn reported High issues"; exit 1; fi
