[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Keep verification metadata free of local paths and machine details.
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Distribute.s.sol reads the ledger and writes batch files. Nothing else.
fs_permissions = [
  { access = "read", path = "./ledger" },
  { access = "read-write", path = "./out-batches" },
]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000
